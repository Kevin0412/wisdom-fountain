 Array.from($('tabs').children).forEach((b,i)=>{b.textContent=b.title=tabLabels[langIndex[language()]][i]});
}

function save(){try{localStorage.setItem('wisdom-chats',JSON.stringify(chats))}catch{$('status').textContent=msg('full')}}
function messageBody(text, cls){
 const node=el('div','',cls);
 // Keep code literal, including dollar signs and LaTeX examples.
 const code=/(\x60{3,})[^\n]*\n([\s\S]*?)(?:\n?\1(?=\n|$)|$)|(\x60+)([^\n]*?)\3/g;
 let end=0;
 for(const match of text.matchAll(code)){
   node.append(text.slice(end,match.index));
   node.append(match[1]?el('pre',match[2]):el('code',match[4]));
   end=match.index+match[0].length;
 }
 node.append(text.slice(end));
 renderMathInElement(node,{
   delimiters:[{left:'$$',right:'$$',display:true},{left:'\\[',right:'\\]',display:true},
               {left:'\\(',right:'\\)',display:false},{left:'$',right:'$',display:false}],
   trust:false,throwOnError:true,strict:'ignore'
 });
 return node;
}
// Use local calendar dates so midnight and daylight-saving changes define the groups.
function calendarDay(date){
 return Date.UTC(date.getFullYear(),date.getMonth(),date.getDate())/86400000;
}
function dateHeading(timestamp,today){
 if(!timestamp)return msg('undated');
 const date=new Date(timestamp);
 const age=today-calendarDay(date);
 if(age<=0)return msg('history');
 if(age===1)return msg('yesterday');
 if(age<=7)return msg('week');
 if(age<=30)return msg('month');
 return date.toLocaleDateString(language(),{year:'numeric',month:'long'});
}
function renderHistory(){
 const history=$('history'),query=$('search').value.toLowerCase();
 history.replaceChildren();
 const today=calendarDay(new Date());
 const rows=chats.map((chat,index)=>({chat,index,time:chat.updatedAt||chat.createdAt||0}));
 rows.sort((a,b)=>b.time-a.time);
 let section,previous,folders;
 for(const {chat,index,time} of rows){
   const title=chat.q[0]?.q||msg('newChat');
   if(!title.toLowerCase().includes(query))continue;
   const heading=dateHeading(time,today);
   if(heading!==previous){
     section=el('section','');
     section.append(el('h3',heading));history.append(section);
     previous=heading;folders=new Map();
   }
   let parent=section;
   if(chat.folder){
     if(!folders.has(chat.folder)){
       const folder=document.createElement('details');folder.open=true;
       folder.append(el('summary',chat.folder));section.append(folder);folders.set(chat.folder,folder);
     }
     parent=folders.get(chat.folder);
   }
   const button=el('button',title,index===current?'active':'');
   button.onclick=()=>{if(busy)return;current=index;document.body.classList.remove('open');$('draft').value='';$('status').textContent='';render()};
   parent.append(button);
 }
}
function refreshAtMidnight(){
 const now=new Date(),next=new Date(now);next.setHours(24,0,0,0);
 setTimeout(()=>{renderHistory();refreshAtMidnight()},next-now);
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)renderHistory()});
function render(){const c=chats[current];$('title').textContent=c.q[0]?.q||msg('newChat');$('title').title=$('title').textContent;$('turns').replaceChildren();c.q.forEach(({q,a})=>{const n=el('section','','turn');n.append(messageBody(q,'question'),messageBody(a,'answer'));$('turns').append(n)});renderHistory();Array.from($('tabs').children).forEach((b,i)=>b.setAttribute('aria-pressed',String(i===c.mode)));$('scroll').scrollTop=$('scroll').scrollHeight}
modes.forEach((name,i)=>{const b=el('button',name);b.title=hints[i];b.onclick=()=>{if(busy)return;chats[current].mode=i;save();render()};$('tabs').append(b)});
$('settings').onclick=()=>{if(busy)return;$('language').value=language();$('base').value=cfg.base||'';$('model').value=cfg.model||'';$('key').value=key;$('config').showModal()};$('cancel').onclick=()=>$('config').close();
$('form').onsubmit=e=>{e.preventDefault();cfg={language:$('language').value,base:$('base').value.trim(),model:$('model').value.trim()};key=$('key').value.trim();localStorage.setItem('wisdom-config',JSON.stringify(cfg));localize();$('status').textContent='';render();$('config').close();document.body.classList.remove('open');$('draft').focus()};
$('newChat').onclick=()=>{if(busy)return;if(chats[current].q.length){chats.unshift({q:[],mode:0,createdAt:Date.now()});current=0}document.body.classList.remove('open');$('search').value='';$('draft').value='';$('status').textContent='';save();render();$('draft').focus()};
function toggleSidebar(){
 const mobile=matchMedia('(max-width:720px)').matches;
 document.body.classList.toggle(mobile?'open':'collapsed');
 const hidden=mobile?!document.body.classList.contains('open'):document.body.classList.contains('collapsed');
 (hidden?$('menu'):$('collapse')).focus();
}
$('collapse').onclick=$('menu').onclick=toggleSidebar;
$('profile').onclick=()=>{
 $('profileMenu').hidden=!$('profileMenu').hidden;
 $('profile').setAttribute('aria-expanded',String(!$('profileMenu').hidden));
};
document.addEventListener('click',e=>{
 if(!e.target.closest('.profile')){$('profileMenu').hidden=true;$('profile').setAttribute('aria-expanded','false')}
 if(e.target.closest('main')&&!e.target.closest('#menu'))document.body.classList.remove('open');
});
$('jump').onclick=()=>$('scroll').scrollTo({top:$('scroll').scrollHeight,behavior:'smooth'});
function openUtility(kind){
 if(busy)return;
 const folder=kind==='folder';$('utilityForm').dataset.kind=kind;
 $('utilityTitle').textContent=msg(kind);$('utilityLabel').textContent=msg(kind+'Label');
 $('utilityValue').value=folder?(chats[current].folder||''):read('wisdom-feedback','');
 $('utilityValue').required=!folder;$('utility').showModal();
}
$('folder').onclick=()=>openUtility('folder');$('feedback').onclick=()=>openUtility('feedback');
$('utilityCancel').onclick=()=>$('utility').close();
$('utilityForm').onsubmit=e=>{e.preventDefault();const value=$('utilityValue').value.trim();
 if($('utilityForm').dataset.kind==='folder'){chats[current].folder=value;save();render()}
 else localStorage.setItem('wisdom-feedback',JSON.stringify(value));
 $('utility').close();
};
$('search').oninput=renderHistory;
$('send').onclick=async()=>{const q=$('draft').value.trim();if(!q||busy)return;const c=chats[current],messages=c.q.flatMap(t=>[{role:'user',content:t.q},{role:'assistant',content:t.a}]);messages.push({role:'user',content:q});busy=true;$('send').disabled=true;$('draft').readOnly=true;c.q.push({q,a:msg('working')});$('draft').value='';$('status').textContent=msg('working');render();
try{const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...cfg,key,mode:c.mode,messages})});const data=await response.json();if(!response.ok)throw Error((labels[data.code]?msg(data.code):msg('failed'))+(data.http?' (HTTP '+data.http+')':''));c.q[c.q.length-1].a=data.answer;c.updatedAt=Date.now();$('status').textContent='';save()}
catch(e){c.q.pop();$('draft').value=q;$('status').textContent=e instanceof TypeError?msg('connection'):e instanceof SyntaxError?msg('failed'):e.message}
finally{busy=false;$('send').disabled=false;$('draft').readOnly=false;render();$('draft').focus()}};
$('draft').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('send').click()}};localize();if(savedChats===null)save();render();refreshAtMidnight();
</script></html>
