name: Refresh README screenshot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - .github/workflows/readme-screenshot.yml
permissions:
  contents: write
concurrency:
  group: readme-screenshot
  cancel-in-progress: true
jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rendering tools
        run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Capture the actual Korean interface
        run: |
          python server.py 8765 &
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from PIL import Image
          import io, time, urllib.request
          url = 'http://127.0.0.1:8765/'
          for attempt in range(30):
              try:
                  urllib.request.urlopen(url, timeout=1).close()
                  break
              except OSError:
                  if attempt == 29:
                      raise
                  time.sleep(1)
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={'width':1360,'height':800}, device_scale_factor=1, locale='ko-KR')
              errors = []
              page.on('pageerror', lambda error: errors.append(str(error)))
              page.goto(url, wait_until='networkidle')
              page.locator('.answer').first.wait_for(state='visible')
              page.evaluate('document.fonts.ready')
              assert page.locator('#history button').count() == 3
              assert page.locator('.turn .question').count() == 1
              question = page.locator('.question').first
              answer = page.locator('.answer').first
              assert question.is_visible() and answer.is_visible()
              assert question.bounding_box()['x'] > answer.bounding_box()['x']
              # Show the beginning of the conversation in the README demo.
              page.locator('#scroll').evaluate('(el) => { el.scrollTop = 0; }')
              assert not errors, errors
              png = page.screenshot(animations='disabled')
              Image.open(io.BytesIO(png)).convert('RGB').save('docs/interface-ko-generated.webp', quality=90, method=6)
              browser.close()
          PY
      - name: Commit refreshed screenshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/interface-ko-generated.webp
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Korean interface screenshot"
            git push
          fi
